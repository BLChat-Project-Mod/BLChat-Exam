plugins {
    id 'eclipse'
    id 'idea'
    id 'fabric-loom' version '1.7-SNAPSHOT'
}

group = mod_group_id
def blchatVersionProps = new Properties()
file('../version.properties').withInputStream { blchatVersionProps.load(it) }
ext.mod_version = blchatVersionProps.getProperty('mod_version')

version = mod_version

base {
    archivesName = mod_id + '-1.20-1.20.1-fabric'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

loom {
    accessWidenerPath = file("src/main/resources/${mod_id}.accesswidener")
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings(loom.layered()) {
        officialMojangMappings()
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    include(modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar).configure {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_id}" }
    }
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors
        ])
    }
}